# Rebuilds search-index.json whenever a guide in docs/ changes, so editors only touch Markdown.
name: Build search index
on:
  push:
    branches: [main]
    paths: ['docs/**', 'build.js']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
      - name: Commit updated index
        run: |
          if git diff --quiet search-index.json; then echo "Index unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add search-index.json
          git commit -m "Rebuild search index"
          git push
